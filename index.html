<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIKEL - ENGLISH 2.0</title>
    <style>
        :root {
            --green: #6b8f71; --green-dk: #4a634e; --grass: #f4f7f5;
            --ink: #334155; --muted: #64748b; --line: #cbd5e1;
            --bg: #f9fbf9; --card: #ffffff;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background: var(--bg); color: var(--ink); 
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
               line-height: 1.6; font-style: normal !important; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: var(--card); 
                padding: 8px; border-radius: 12px; border: 1px solid var(--line); }
        .tab { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; 
               font-weight: 600; color: var(--muted); background: transparent; }
        .tab.active { background: var(--green); color: white; }
        .panel { display: none; }
        .panel.active { display: block; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; 
                padding: 22px; margin-bottom: 14px; }
        .btn-audio { background: transparent; border: 1px solid var(--green); color: var(--green); 
                     cursor: pointer; border-radius: 6px; padding: 4px 8px; font-size: 13px; 
                     margin-left: 8px; vertical-align: middle; }
        .btn-audio:hover { background: var(--grass); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>MIKEL - ENGLISH 2.0</h1></header>

    <div class="tabs" id="tabs">
        <button class="tab active" data-tab="p1">1. Modules</button>
        <button class="tab" data-tab="p2">2. The Graveyard</button>
    </div>

    <!-- MAIN MODULES -->
    <div class="panel active" id="p1">
        <div class="card">
            <h2>Professional Scenarios</h2>
            <div id="p1-content"></div>
        </div>
    </div>

    <!-- THE GRAVEYARD -->
    <div class="panel" id="p2">
        <div class="card">
            <h2>The Graveyard</h2>
            <p>Retired modules.</p>
        </div>
    </div>
</div>

<script>
    /* 1. DATA */
    const modules = [
        { id: 1, text: "Handling a plagiarism case" },
        { id: 2, text: "Assessing a student's progress" },
        { id: 3, text: "Organizing the syllabus" }
    ];

    /* 2. AUDIO ENGINE */
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    /* 3. RENDER CONTENT */
    const wrap = document.getElementById('p1-content');
    modules.forEach(m => {
        const div = document.createElement('div');
        div.style.margin = "10px 0";
        div.innerHTML = `${m.id}. ${m.text} 
            <button class="btn-audio" onclick="speakText('${m.text}')">🔊 Pronounce</button>`;
        wrap.appendChild(div);
    });

    /* 4. TABS LOGIC */
    document.querySelectorAll('.tab').forEach(t => {
        t.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            document.getElementById(t.dataset.tab).classList.add('active');
        });
    });
</script>
</body>
</html>
